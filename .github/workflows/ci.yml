name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Dependency-free checks
        run: make test

  desktop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The suite is self-contained: its class setUp points FLUTTER_RELEASE_HOME at a
      # temporary vault, so a cold runner needs no prepared ~/.flutter-release.
      - name: Build desktop app
        run: swift build --package-path desktop/ReleaseKitApp
      - name: Desktop tests
        run: make desktop

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Pinned so a new ruff release cannot turn CI red without a change here.
      - name: Ruff
        run: pipx run ruff==0.16.2 check bin/frk tests/ integrations/mcp/

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional MCP runner
        run: python -m pip install uv==0.11.9
      - name: MCP protocol and isolated job tests
        run: make mcp

  # Pinned to 24.04: actions/python-versions publishes no 3.9 build for newer
  # images, and the 3.9 leg is the entire point of this job.
  python-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m py_compile bin/frk
      - name: CLI tests
        run: python -m unittest discover -s tests
